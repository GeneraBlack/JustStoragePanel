name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      MAVEN_URL: ${{ vars.MAVEN_URL != '' && vars.MAVEN_URL || format('https://maven.pkg.github.com/{0}', github.repository) }}
      MAVEN_USERNAME: ${{ vars.MAVEN_USERNAME != '' && vars.MAVEN_USERNAME || github.actor }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD != '' && secrets.MAVEN_PASSWORD || secrets.GITHUB_TOKEN }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_RELEASE_TYPE: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release artifacts
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: juststoragepanel-${{ github.ref_name }}
          path: build/libs/*.jar

  publish-maven:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.MAVEN_URL != '' || github.repository != '' }}
    env:
      GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      MAVEN_URL: ${{ vars.MAVEN_URL != '' && vars.MAVEN_URL || format('https://maven.pkg.github.com/{0}', github.repository) }}
      MAVEN_USERNAME: ${{ vars.MAVEN_USERNAME != '' && vars.MAVEN_USERNAME || github.actor }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD != '' && secrets.MAVEN_PASSWORD || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven repository
        run: ./gradlew publish

  publish-curseforge:
    needs: build
    runs-on: ubuntu-latest
    env:
      GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_RELEASE_TYPE: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to CurseForge
        if: ${{ env.CURSEFORGE_PROJECT_ID != '' && env.CURSEFORGE_TOKEN != '' }}
        run: ./gradlew --no-configuration-cache publishCurseForge

  create-github-release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.ref_type == 'tag' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: juststoragepanel-${{ github.ref_name }}
          path: release-artifacts

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.jar
          body_path: CHANGELOG.md