name: Release Recovery

on:
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  actions: read
  contents: read
  packages: write

jobs:
  inspect-release:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    outputs:
      target_sha: ${{ steps.inspect.outputs.target_sha }}
      should_publish_maven: ${{ steps.inspect.outputs.should_publish_maven }}
      should_publish_curseforge: ${{ steps.inspect.outputs.should_publish_curseforge }}

    steps:
      - name: Inspect release job results
        id: inspect
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const { data } = await github.rest.actions.listJobsForWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
              per_page: 100
            });

            const findJob = (name) => data.jobs.find((job) => job.name === name);
            const hasTerminalFailure = (job) => !job || ['failure', 'cancelled', 'skipped', 'timed_out', 'action_required'].includes(job.conclusion || '');
            const findStep = (job, stepName) => job?.steps?.find((step) => step.name === stepName);
            const publishStepSucceeded = (job, stepName) => findStep(job, stepName)?.conclusion === 'success';
            const configStepFailed = (job, stepName) => findStep(job, stepName)?.conclusion === 'failure';
            const needsPublishRetry = (job, publishStepName, validationStepName) => {
              if (!job) {
                return true;
              }

              if (publishStepSucceeded(job, publishStepName)) {
                return false;
              }

              if (validationStepName && configStepFailed(job, validationStepName)) {
                return false;
              }

              return hasTerminalFailure(job) || findStep(job, publishStepName)?.conclusion !== 'success';
            };

            const buildJob = findJob('build');
            const buildSucceeded = buildJob?.conclusion === 'success';
            const shouldPublishMaven = buildSucceeded && hasTerminalFailure(findJob('publish-maven'));
            const shouldPublishCurseForge = buildSucceeded && needsPublishRetry(
              findJob('publish-curseforge'),
              'Publish to CurseForge',
              'Validate CurseForge configuration'
            );

            core.info(`Release run ${runId} build conclusion: ${buildJob?.conclusion || 'missing'}`);
            core.info(`Retry Maven publish: ${shouldPublishMaven}`);
            core.info(`Retry CurseForge publish: ${shouldPublishCurseForge}`);

            core.setOutput('target_sha', context.payload.workflow_run.head_sha);
            core.setOutput('should_publish_maven', shouldPublishMaven ? 'true' : 'false');
            core.setOutput('should_publish_curseforge', shouldPublishCurseForge ? 'true' : 'false');

  retry-maven:
    needs: inspect-release
    runs-on: ubuntu-latest
    if: ${{ needs.inspect-release.outputs.should_publish_maven == 'true' }}
    env:
      GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      MAVEN_URL: ${{ vars.MAVEN_URL != '' && vars.MAVEN_URL || format('https://maven.pkg.github.com/{0}', github.repository) }}
      MAVEN_USERNAME: ${{ vars.MAVEN_USERNAME != '' && vars.MAVEN_USERNAME || github.actor }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD != '' && secrets.MAVEN_PASSWORD || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect-release.outputs.target_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven repository
        run: ./gradlew publish

  retry-curseforge:
    needs: inspect-release
    runs-on: ubuntu-latest
    if: ${{ needs.inspect-release.outputs.should_publish_curseforge == 'true' }}
    env:
      GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_RELEASE_TYPE: release

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect-release.outputs.target_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate CurseForge configuration
        shell: bash
        run: |
          if [ -z "${CURSEFORGE_PROJECT_ID}" ] || [ -z "${CURSEFORGE_TOKEN}" ]; then
            echo "::error::CURSEFORGE_PROJECT_ID and CURSEFORGE_TOKEN must both be configured for CurseForge publishing."
            exit 1
          fi

      - name: Publish to CurseForge
        run: ./gradlew --no-configuration-cache publishCurseForge
