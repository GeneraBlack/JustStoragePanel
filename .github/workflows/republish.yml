name: Re-Publish

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Git tag or branch to publish
        required: true
        default: main
        type: string
      publish_maven:
        description: Publish to Maven
        required: true
        default: true
        type: boolean
      publish_curseforge:
        description: Publish to CurseForge
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build release artifacts
        run: ./gradlew build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: republish-${{ inputs.target_ref }}
          path: build/libs/*.jar
          if-no-files-found: error

  publish-maven:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_maven }}
    env:
      GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      MAVEN_URL: ${{ vars.MAVEN_URL != '' && vars.MAVEN_URL || format('https://maven.pkg.github.com/{0}', github.repository) }}
      MAVEN_USERNAME: ${{ vars.MAVEN_USERNAME != '' && vars.MAVEN_USERNAME || github.actor }}
      MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD != '' && secrets.MAVEN_PASSWORD || secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Publish to Maven repository
        shell: bash
        run: |
          set +e
          output=$(./gradlew publish 2>&1)
          status=$?
          echo "$output"
          if [ $status -ne 0 ]; then
            if echo "$output" | grep -q "status code 409"; then
              echo "Package is already published in Maven repository (409 Conflict). Marking as successful."
              exit 0
            fi
            exit $status
          fi

  publish-curseforge:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ inputs.publish_curseforge }}
    env:
      GIT_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
      CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
      CURSEFORGE_RELEASE_TYPE: release

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate CurseForge configuration
        shell: bash
        run: |
          if [ -z "${CURSEFORGE_PROJECT_ID}" ] || [ -z "${CURSEFORGE_TOKEN}" ]; then
            echo "::error::CURSEFORGE_PROJECT_ID and CURSEFORGE_TOKEN must both be configured for CurseForge publishing."
            exit 1
          fi

      - name: Publish to CurseForge
        run: ./gradlew --no-configuration-cache publishCurseForge
